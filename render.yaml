services:
  - type: web
    name: mcq-pdf-vision-assistant
    env: docker
    dockerfilePath: ./Dockerfile.fullstack
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TEXT_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_VISION_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_WEB_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: PDF_OCR_ENABLED
        value: "true"
      - key: PDF_OCR_PROVIDER
        value: tesseract
      - key: PDF_OCR_LANGUAGE
        value: deu+eng
      - key: PDF_RENDER_DPI
        value: "220"
      - key: SERVE_FRONTEND
        value: "true"
      - key: SQLITE_URL
        value: sqlite:////app/data/app.db
      - key: DATA_DIR
        value: /app/data
      - key: UPLOAD_DIR
        value: /app/data/uploads
    disk:
      name: mcq-data
      mountPath: /app/data
      sizeGB: 1
