services:
  - type: web
    name: mcq-pdf-vision-assistant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.fullstack
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PDF_OCR_ENABLED
        value: "true"
      - key: PDF_OCR_PROVIDER
        value: tesseract
      - key: PDF_OCR_LANGUAGE
        value: deu+eng
      - key: PDF_RENDER_DPI
        value: "220"
      - key: SERVE_FRONTEND
        value: "true"
      - key: SQLITE_URL
        value: sqlite:////app/data/app.db
      - key: DATA_DIR
        value: /app/data
      - key: UPLOAD_DIR
        value: /app/data/uploads
